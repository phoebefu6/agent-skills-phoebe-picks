name: Refresh stats

# stats.json backs the README badges and the live gallery counts. Regenerating
# it on every push to the review data means no number in this repo is ever
# hand-maintained.

on:
  schedule:
    - cron: "22 22 * * *" # 06:22 Singapore time, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/reviews.js
      - scripts/build-stats.js

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild stats.json
        run: node scripts/build-stats.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- stats.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "chore: refresh stats.json"
          git push
