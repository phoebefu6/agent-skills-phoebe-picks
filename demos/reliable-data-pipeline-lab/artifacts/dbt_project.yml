name: reliable_orders
version: 1.0.0
config-version: 2
profile: reliable_orders
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  incremental_lookback_hours: 2

models:
  reliable_orders:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: incremental
      +schema: analytics
